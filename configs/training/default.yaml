# Default training hyperparameters
run_name: vla-training-run
experiment_name: vla-eval
num_epochs: 10
batch_size: 32
learning_rate: 1.0e-4
weight_decay: 1.0e-4
warmup_steps: 100
grad_clip_norm: 1.0
num_workers: 2
device: cpu
checkpoint_dir: ./models/checkpoints
val_ratio: 0.1
early_stopping_patience: 5
log_every_n_steps: 10
