[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-eval"
version = "0.1.0"
description = "Production-grade platform for training, benchmarking, and evaluating Vision-Language-Action (VLA) robotics models."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "VLA-Eval Contributors" }]
keywords = ["robotics", "vla", "vision-language-action", "machine-learning", "pytorch", "lerobot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "transformers>=4.41.0,<5.0.0",
  "accelerate>=0.30.0",
  "peft>=0.11.0",
  "datasets>=2.19.0",
  "huggingface-hub>=0.23.0",
  "safetensors>=0.4.3",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pillow>=10.3.0",
  "opencv-python-headless>=4.9.0",
  "mlflow>=2.13.0",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "structlog>=24.1.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "tenacity>=8.3.0",
  "matplotlib>=3.8.4",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "httpx>=0.27.0",
  "ruff>=0.4.8",
  "mypy>=1.10.0",
  "black>=24.4.2",
  "pre-commit>=3.7.1",
  "bandit>=1.7.9",
  "types-PyYAML",
]
lerobot = [
  "lerobot @ git+https://github.com/huggingface/lerobot.git",
]

[project.scripts]
vla-eval = "vla_eval.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vla_eval = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "frontend/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=vla_eval --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
  "integration: marks tests as integration tests",
  "slow: marks tests as slow-running",
  "gpu: marks tests that require a GPU",
]

[tool.coverage.run]
source = ["src/vla_eval"]
omit = ["*/tests/*"]
