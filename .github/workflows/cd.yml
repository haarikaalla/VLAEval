name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      image_namespace: ${{ steps.vars.outputs.image_namespace }}
    steps:
      - id: vars
        run: |
          # GHCR rejects image names containing uppercase characters, and
          # ${{ github.repository }} preserves the repo's original casing.
          echo "image_namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [prepare]
    strategy:
      matrix:
        component: [api, worker, frontend, mlflow]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_namespace }}-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan-images:
    name: Scan Images with Trivy
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    strategy:
      matrix:
        component: [api, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan the commit-pinned tag: "latest" only exists for default-branch
          # pushes, so it is missing on tag builds.
          image-ref: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_namespace }}-${{ matrix.component }}:sha-${{ github.sha }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
