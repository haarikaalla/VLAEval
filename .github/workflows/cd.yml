name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      image_namespace: ${{ steps.vars.outputs.image_namespace }}
      deploy_enabled: ${{ steps.vars.outputs.deploy_enabled }}
    steps:
      - id: vars
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          # GHCR rejects image names containing uppercase characters, and
          # ${{ github.repository }} preserves the repo's original casing.
          echo "image_namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          # Deploying needs a real cluster. Skip (rather than fail) when the
          # kubeconfig secret has not been configured yet.
          if [ -n "$KUBE_CONFIG" ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBE_CONFIG secret is not set - skipping deployment."
          fi

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [prepare]
    strategy:
      matrix:
        component: [api, worker, frontend, mlflow]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_namespace }}-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan-images:
    name: Scan Images with Trivy
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    strategy:
      matrix:
        component: [api, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan the commit-pinned tag: "latest" only exists for default-branch
          # pushes, so it is missing on tag builds.
          image-ref: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_namespace }}-${{ matrix.component }}:sha-${{ github.sha }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    if: needs.prepare.outputs.deploy_enabled == 'true'
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k deploy/k8s/overlays/${{ github.event.inputs.environment || 'staging' }}

      - name: Deploy built image tags
        run: |
          IMAGE_PREFIX="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_namespace }}"
          IMAGE_TAG="sha-${{ github.sha }}"

          kubectl set image deployment/vla-eval-api \
            api="${IMAGE_PREFIX}-api:${IMAGE_TAG}" \
            -n vla-eval
          kubectl set image deployment/vla-eval-worker \
            worker="${IMAGE_PREFIX}-worker:${IMAGE_TAG}" \
            -n vla-eval
          kubectl set image deployment/vla-eval-frontend \
            frontend="${IMAGE_PREFIX}-frontend:${IMAGE_TAG}" \
            -n vla-eval
          kubectl set image deployment/vla-eval-mlflow \
            mlflow="${IMAGE_PREFIX}-mlflow:${IMAGE_TAG}" \
            -n vla-eval

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/vla-eval-mlflow -n vla-eval --timeout=300s
          kubectl rollout status deployment/vla-eval-api -n vla-eval --timeout=300s
          kubectl rollout status deployment/vla-eval-worker -n vla-eval --timeout=300s
          kubectl rollout status deployment/vla-eval-frontend -n vla-eval --timeout=300s
