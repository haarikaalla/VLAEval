apiVersion: v1
kind: ConfigMap
metadata:
  name: vla-eval-config
  namespace: vla-eval
data:
  APP_ENV: "production"
  APP_NAME: "vla-eval"
  APP_LOG_LEVEL: "INFO"
  API_CORS_ORIGINS: "https://vla-eval.example.com"
  MLFLOW_TRACKING_URI: "http://vla-eval-mlflow:5000"
  MLFLOW_EXPERIMENT_NAME: "vla-eval"
  REDIS_URL: "redis://vla-eval-redis:6379/0"
  HF_HOME: "/data/hf_cache"
  TRAINING_DEVICE: "cuda"
