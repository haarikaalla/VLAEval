apiVersion: apps/v1
kind: Deployment
metadata:
  name: vla-eval-worker
  namespace: vla-eval
  labels:
    app.kubernetes.io/name: vla-eval-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vla-eval-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vla-eval-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: ghcr.io/haarikaalla/vlaeval-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vla-eval-config
            - secretRef:
                name: vla-eval-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1" # remove/override on CPU-only clusters
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /app/models
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vla-eval-dataset-cache
        - name: models
          persistentVolumeClaim:
            claimName: vla-eval-model-checkpoints
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vla-eval-worker
  namespace: vla-eval
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vla-eval-worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
