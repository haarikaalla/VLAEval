apiVersion: apps/v1
kind: Deployment
metadata:
  name: vla-eval-frontend
  namespace: vla-eval
  labels:
    app.kubernetes.io/name: vla-eval-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vla-eval-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vla-eval-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: ghcr.io/haarikaalla/vla-eval-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: vla-eval-frontend
  namespace: vla-eval
spec:
  selector:
    app.kubernetes.io/name: vla-eval-frontend
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
