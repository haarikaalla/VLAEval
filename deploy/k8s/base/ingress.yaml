apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vla-eval-ingress
  namespace: vla-eval
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["vla-eval.example.com"]
      secretName: vla-eval-tls
  rules:
    - host: vla-eval.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vla-eval-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vla-eval-frontend
                port:
                  number: 8080
