apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vla-eval-dataset-cache
  namespace: vla-eval
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vla-eval-model-checkpoints
  namespace: vla-eval
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vla-eval-mlflow-artifacts
  namespace: vla-eval
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
