apiVersion: apps/v1
kind: Deployment
metadata:
  name: vla-eval-api
  namespace: vla-eval
  labels:
    app.kubernetes.io/name: vla-eval-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vla-eval-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vla-eval-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/haarikaalla/vlaeval-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: vla-eval-config
            - secretRef:
                name: vla-eval-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /app/models
            - name: reports
              mountPath: /app/reports
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vla-eval-dataset-cache
        - name: models
          persistentVolumeClaim:
            claimName: vla-eval-model-checkpoints
        - name: reports
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vla-eval-api
  namespace: vla-eval
spec:
  selector:
    app.kubernetes.io/name: vla-eval-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vla-eval-api
  namespace: vla-eval
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vla-eval-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
