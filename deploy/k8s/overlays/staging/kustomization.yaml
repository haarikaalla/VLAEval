apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vla-eval
resources:
  - ../../base
  - secret.yaml
namePrefix: ""
patches:
  - path: patch-replicas.yaml
configMapGenerator:
  - name: vla-eval-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - API_CORS_ORIGINS=https://staging.vla-eval.example.com
images:
  - name: ghcr.io/your-org/vla-eval-api
    newTag: staging
  - name: ghcr.io/your-org/vla-eval-worker
    newTag: staging
  - name: ghcr.io/your-org/vla-eval-frontend
    newTag: staging
