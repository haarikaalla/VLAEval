apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vla-eval
resources:
  - ../../base
  - secret.yaml
namePrefix: ""
patches:
  - path: patch-replicas.yaml
  - path: patch-config.yaml
  - path: patch-worker-cpu.yaml
    target:
      kind: Deployment
      name: vla-eval-worker
images:
  # Image names must match what CD publishes: ghcr.io/<owner>/<repo lowercased>-<component>.
  # The "latest" tag is published on every default-branch build; the deploy job
  # then pins the exact commit via `kubectl set image`.
  - name: ghcr.io/haarikaalla/vlaeval-api
    newTag: latest
  - name: ghcr.io/haarikaalla/vlaeval-worker
    newTag: latest
  - name: ghcr.io/haarikaalla/vlaeval-frontend
    newTag: latest
  - name: ghcr.io/haarikaalla/vlaeval-mlflow
    newTag: latest
