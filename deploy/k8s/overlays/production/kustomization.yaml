apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vla-eval
resources:
  - ../../base
  - secret.yaml
configMapGenerator:
  - name: vla-eval-config
    behavior: merge
    literals:
      - APP_ENV=production
      - API_CORS_ORIGINS=https://vla-eval.example.com
images:
  - name: ghcr.io/your-org/vla-eval-api
    newTag: latest
  - name: ghcr.io/your-org/vla-eval-worker
    newTag: latest
  - name: ghcr.io/your-org/vla-eval-frontend
    newTag: latest
